# OSD 용 디스크. Docker Desktop 의 노드엔 빈 블록 디바이스가 없어서 노드 안의 파일(/var/lib/modu-ceph/osd0.img, 10GiB, sparse)을
# /dev/loop7 로 붙인다(Ceph 문서상 테스트용). Docker Desktop 이 재시작되면 loop 는 사라지므로 이 DaemonSet 이 부팅마다 다시 붙인다 —
# 파일은 남아 있어 OSD 데이터가 이어진다. 운영 클러스터에선 이 파일이 없고 노드 디스크를 CephCluster storage.devices 에 적는다.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: loop-disk
  namespace: rook-ceph
  labels:
    app: loop-disk
spec:
  selector:
    matchLabels:
      app: loop-disk
  template:
    metadata:
      labels:
        app: loop-disk
    spec:
      hostPID: true
      containers:
        - name: loop
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -eu
              IMG=/host/var/lib/modu-ceph/osd0.img
              mkdir -p /host/var/lib/modu-ceph
              [ -f "$IMG" ] || { echo "creating $IMG (10GiB sparse)"; dd if=/dev/zero of="$IMG" bs=1M count=0 seek=10240; }
              [ -e /dev/loop7 ] || mknod /dev/loop7 b 7 7
              if losetup /dev/loop7 2>/dev/null | grep -q osd0.img; then echo "/dev/loop7 already attached"
              else losetup /dev/loop7 "$IMG" && echo "/dev/loop7 <- $IMG"; fi
              losetup /dev/loop7
              # 노드엔 udevd 가 없어 ceph-volume(OSD prepare)의 "No udev data could be retrieved for /sys/block/loop7" 가 난다 —
              # udev DB 항목(/run/udev/data/b<major>:<minor>)을 손으로 써 준다. OSD prepare 파드는 hostPath /run/udev 를 본다.
              # ceph-volume inventory 는 모든 블록 디바이스·파티션(nbd0..15, vda1 포함)을 훑으므로 전부 써 준다.
              mkdir -p /host/run/udev/data
              for d in /sys/class/block/*; do
                n=$(basename "$d"); mm=$(cat "$d/dev"); f="/host/run/udev/data/b$mm"
                t=disk; [ -f "$d/partition" ] && t=partition
                [ -f "$f" ] || printf 'E:DEVNAME=/dev/%s\nE:DEVTYPE=%s\nE:MAJOR=%s\nE:MINOR=%s\nE:SUBSYSTEM=block\nE:ID_TYPE=disk\nI:0\n' "$n" "$t" "${mm%%:*}" "${mm#*:}" > "$f"
              done
              echo "udev db entries: $(ls /host/run/udev/data | wc -l)"
              # 붙여 두기만 하면 되므로 대기. 파드가 죽어도 loop 는 남는다.
              while :; do sleep 3600; done
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: host-var-lib
              mountPath: /host/var/lib/modu-ceph
            - name: host-run-udev
              mountPath: /host/run/udev
          resources:
            requests: {memory: 8Mi, cpu: 5m}
            limits: {memory: 32Mi}
      volumes:
        - name: dev
          hostPath: {path: /dev}
        - name: host-var-lib
          hostPath: {path: /var/lib/modu-ceph, type: DirectoryOrCreate}
        - name: host-run-udev
          hostPath: {path: /run/udev, type: DirectoryOrCreate}
