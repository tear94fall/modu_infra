# Mac 에서 들어오는 입구(dev). RGW(S3) 7480 — 운영 스크립트·rclone 용. Ceph 대시보드 7001(admin, 비밀번호는 Secret rook-ceph-dashboard-password). 7000 은 macOS AirPlay 수신기가 쓴다(LB 가 pending).
apiVersion: v1
kind: Service
metadata:
  name: rgw-lb
  namespace: rook-ceph
  labels:
    app: rook-ceph-rgw
spec:
  type: LoadBalancer
  selector:
    app: rook-ceph-rgw
    rook_object_store: modu
  ports:
    - name: http
      port: 7480
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ceph-dashboard-lb
  namespace: rook-ceph
  labels:
    app: rook-ceph-mgr
spec:
  type: LoadBalancer
  selector:
    app: rook-ceph-mgr
    mgr_role: active
  ports:
    - name: http-dashboard
      port: 7001
      targetPort: 7000
