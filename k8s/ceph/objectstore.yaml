# S3 게이트웨이(RGW) + storage-service 용 사용자. 사용자 키는 Rook 이 Secret rook-ceph-object-user-modu-storage-service(AccessKey/SecretKey)로 만든다 →
# config-repo storage-service.yml 의 s3.accessKey/secretKey 에 {cipher} 로 넣는다(README "Ceph" 절).
apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: modu
  namespace: rook-ceph
spec:
  metadataPool:
    replicated:
      size: 1
      requireSafeReplicaSize: false
  dataPool:
    replicated:
      size: 1
      requireSafeReplicaSize: false
  preservePoolsOnDelete: true
  gateway:
    port: 80
    instances: 1
    resources:
      requests: {memory: 256Mi, cpu: 50m}
      limits: {memory: 512Mi}
---
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: storage-service
  namespace: rook-ceph
spec:
  store: modu
  displayName: "storage-service (modu messenger)"
  quotas:
    maxBuckets: 10
  # 키를 고정한다(Secret rgw-storage-service-keys 의 AccessKey/SecretKey, Git 에 없음 — README "Ceph"). 클러스터를 다시 만들어도 config-repo 의
  # {cipher} 값이 그대로 맞는다. Secret 이 없으면 Rook 이 새 키를 만들고 config-repo 를 다시 암호화해야 한다.
  keys:
    - accessKeyRef:
        name: rgw-storage-service-keys
        key: AccessKey
      secretKeyRef:
        name: rgw-storage-service-keys
        key: SecretKey
