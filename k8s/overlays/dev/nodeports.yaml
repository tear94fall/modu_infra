# Mac 에서 접근하는 입구. Docker Desktop 은 NodePort 를 localhost 로 매핑한다(http://localhost:30080 …).
# compose 의 호스트 포트(8000/8082/8081/8084/8085)에 30000 을 더한 번호를 쓴다. 안드로이드 기기에서는 Mac 의 LAN IP:30080.
apiVersion: v1
kind: Service
metadata:
  name: gateway-nodeport
  labels:
    app: gateway-service
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
  - name: http
    port: 8000
    targetPort: http
    nodePort: 30080
---
