# config-service 가 읽는 Secret 의 틀. 값은 modu_platform/.env 의 ENCRYPT_KEY, INTERNAL_API_TOKEN 과 같아야 한다
# (INTERNAL_API_TOKEN 은 config-repo application.yml 의 modu.internal-api.token {cipher} 평문과 같은 값 — README '시크릿 지도').
# kustomization 에 넣지 않는다. 실제 Secret 은 한 번만 kubectl 로 만든다:
#   set -a; source ~/workspace/modu_platform/.env; set +a
#   kubectl -n modu create secret generic config-service \
#     --from-literal=ENCRYPT_KEY="$ENCRYPT_KEY" --from-literal=INTERNAL_API_TOKEN="$INTERNAL_API_TOKEN"
apiVersion: v1
kind: Secret
metadata:
  name: config-service
  namespace: modu
type: Opaque
stringData:
  ENCRYPT_KEY: ""
  INTERNAL_API_TOKEN: ""
