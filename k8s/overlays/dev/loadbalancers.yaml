# Mac 에서 들어오는 입구. Docker Desktop 의 k8s 는 LoadBalancer Service 를 Mac 의 모든 인터페이스(*:<port>)로 연다
# (NodePort 는 localhost 로 안 나온다). compose 가 쓰던 호스트 포트를 그대로 써서 앱·콘솔·커머스 웹이 주소를 안 바꿔도 된다.
# 안드로이드 기기는 Mac 의 LAN IP:8000. config-service 8888 은 dev 도구(토큰 발급 스크립트, 콘솔의 설정 화면)용.
apiVersion: v1
kind: Service
metadata:
  name: gateway-service-lb
  labels:
    app: gateway-service
spec:
  type: LoadBalancer
  selector:
    app: gateway-service
  ports:
  - name: http
    port: 8000
    targetPort: http
