# MySQL·Mongo·Redis·Kafka 는 열지 않는다 — 맥에서 붙을 때는 kubectl -n modu port-forward svc/mysql-member 3306:3306 (README).
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards-lb
  labels:
    app: opensearch-dashboards
spec:
  type: LoadBalancer
  selector:
    app: opensearch-dashboards
  ports:
  - name: http
    port: 5601
    targetPort: http
---
# 로그 스크립트·curl 용(compose 는 127.0.0.1:9200 에만 열었지만 LoadBalancer 는 모든 인터페이스 — 보안 플러그인이 꺼져 있으니 LAN 에 열린다는 점 주의)
apiVersion: v1
kind: Service
metadata:
  name: opensearch-lb
  labels:
    app: opensearch
spec:
  type: LoadBalancer
  selector:
    app: opensearch
  ports:
  - name: http
    port: 9200
    targetPort: http
