# 루트 도메인 정적 페이지(2026-10-20) — https://joonsublim.com (+www). nginx 가 ConfigMap 의 index.html 한 장을 서빙한다.
# 프로젝트 소개와 입구 링크(모두의 커머스 웹, GitHub)만. 내용을 바꾸려면 ConfigMap 을 고치고 `kubectl -n modu rollout restart deploy/web-root`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-root
  labels:
    app: web-root
    app.kubernetes.io/name: web-root
    app.kubernetes.io/component: web
data:
  index.html: |
    <!doctype html>
    <html lang="ko">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>모두 — 모두의 메신저 · 모두의 커머스</title>
      <meta name="description" content="모두의 메신저와 모두의 커머스 — 채팅·커머스를 한 계정으로 쓰는 개인 프로젝트">
      <style>
        :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --muted: #64748b; --card: #ffffff; --line: #e2e8f0; --accent: #2563eb; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --fg: #e2e8f0; --muted: #94a3b8; --card: #1e293b; --line: #334155; --accent: #60a5fa; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; line-height: 1.55; }
        main { width: min(640px, 100% - 32px); padding: 40px 0; }
        h1 { font-size: 2.2rem; margin: 0 0 6px; letter-spacing: -0.02em; }
        p.lead { margin: 0 0 28px; color: var(--muted); }
        .cards { display: grid; gap: 14px; grid-template-columns: 1fr; }
        @media (min-width: 560px) { .cards { grid-template-columns: 1fr 1fr; } }
        a.card { display: block; padding: 18px 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: inherit; text-decoration: none; transition: border-color .15s; }
        a.card:hover { border-color: var(--accent); }
        a.card strong { display: block; font-size: 1.05rem; margin-bottom: 4px; }
        a.card span { color: var(--muted); font-size: 0.92rem; }
        footer { margin-top: 32px; color: var(--muted); font-size: 0.85rem; }
        footer a { color: var(--muted); }
      </style>
    </head>
    <body>
      <main>
        <h1>모두</h1>
        <p class="lead">모두의 메신저 · 모두의 커머스 — 채팅과 쇼핑을 한 계정으로 쓰는 개인 프로젝트입니다.</p>
        <div class="cards">
          <a class="card" href="https://dev-shop.joonsublim.com/">
            <strong>모두의 커머스 (웹)</strong>
            <span>상품 · 장바구니 · 주문 · 포인트 · 쿠폰</span>
          </a>
          <a class="card" href="https://github.com/tear94fall/modu_chat">
            <strong>모두의 메신저 (GitHub)</strong>
            <span>안드로이드 앱 + Kotlin/Spring 백엔드</span>
          </a>
          <a class="card" href="https://github.com/tear94fall/modu_commerce">
            <strong>모두의 커머스 (GitHub)</strong>
            <span>React 웹 + WebView 앱 + 커머스 백엔드</span>
          </a>
          <a class="card" href="https://github.com/tear94fall/modu_infra">
            <strong>인프라 (GitHub)</strong>
            <span>Kubernetes · Argo CD · 운영 스크립트</span>
          </a>
        </div>
        <footer>개발 환경을 그대로 열어 둔 곳이라 가끔 멈출 수 있습니다. <a href="https://github.com/tear94fall">@tear94fall</a></footer>
      </main>
    </body>
    </html>
  default.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;
      location = /healthz { return 200 "ok\n"; }
      location / { try_files /index.html =404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-root
  labels:
    app: web-root
    app.kubernetes.io/name: web-root
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-root
  template:
    metadata:
      labels:
        app: web-root
        app.kubernetes.io/name: web-root
        app.kubernetes.io/component: web
    spec:
      enableServiceLinks: false
      containers:
      - name: nginx
        image: nginx:1.29-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 5
        resources:
          requests: {memory: 16Mi, cpu: 10m}
          limits: {memory: 64Mi}
        volumeMounts:
        - name: page
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
          readOnly: true
        - name: page
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
      volumes:
      - name: page
        configMap:
          name: web-root
---
apiVersion: v1
kind: Service
metadata:
  name: web-root
  labels:
    app: web-root
    app.kubernetes.io/name: web-root
    app.kubernetes.io/component: web
spec:
  selector:
    app: web-root
  ports:
  - name: http
    port: 80
    targetPort: http
