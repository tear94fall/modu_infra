# 복제 수. 앱 18개의 파드 수는 Rollout(spec.replicas, base 에서 1 — config·gateway 는 2)이 가진다(2026-11-15). dev 는 아래 patches 로 config·gateway 를 1 로.
# 여기 replicas: 에는 Rollout 이 아닌 것만 남는다. Deployment 는 base 에서 replicas 0(템플릿) — 여기서 1 로 되돌리면 파드가 둘로 뜬다.
# 메모리 requests 합(JVM 14개×512Mi + nginx 4개×16Mi ≈ 7.1GiB)이 노드 allocatable 을 넘으면 Pending 이 된다 — Docker Desktop 메모리를 확인(README).
replicas:
  # Pinpoint 스택 — dev 에선 꺼 둠(아래 patches 주석 참고). PVC(pinpoint-hbase-data, pinpoint-mysql)는 남아 있어 켜면 데이터가 이어진다.
  - name: zoo1
    count: 0
  - name: pinpoint-hbase
    count: 0
  - name: pinpoint-mysql
    count: 0
  - name: pinpoint-redis
    count: 0
  - name: pinpoint-collector
    count: 0
  - name: pinpoint-web
    count: 0

# Pinpoint — dev 에선 2026-10-04 부터 꺼 둔다(결정: APM 은 운영 환경에서만, dev 는 필요할 때 켠다). 메모리 상한 약 4.6GiB 를 비워
# Argo CD·GoCD 자리로 쓴다. 켜는 법은 README "Pinpoint 켜기/끄기". 아래 patches 를 되살리고 replicas 의 Pinpoint 6개를 1 로.
# 에이전트 패치를 되살리면 JVM 13개 템플릿이 한꺼번에 바뀌므로 README 의 "롤아웃은 한 번에 하나씩" 절차로 apply 할 것.
#patches:
#  - path: pinpoint-agent-patch.yaml
#    target:
#      kind: Deployment
#      name: "(auth|chat|chat-store|member|point|profile|push|ws|gateway|commerce)-service"
#  - path: pinpoint-agent-patch-append.yaml
#    target:
#      kind: Deployment
#      name: "(storage|config)-service"

# Rollout 파드 수(dev). 1 노드라 config·gateway 도 1. replicas 를 바꾸면 steps 도 k8s/rollouts/steps.sh 로 다시 만들고 rollouts/check.sh 로 확인.
patches:
  - target: {group: argoproj.io, kind: Rollout, name: config-service}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/strategy/canary/steps
        value: []
  - target: {group: argoproj.io, kind: Rollout, name: gateway-service}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/strategy/canary/steps
        value: []
