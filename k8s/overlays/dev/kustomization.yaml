# dev 오버레이: 로컬 Colima(k3s, context colima, 1 노드 — 2026-10-06 까지는 Docker Desktop 이었다). 네임스페이스는 base 와 같은 modu.
# 앱 계층 + 인프라(base/data, base/observability) 전부 k8s 안. 2026-10-03 에 compose 인프라와 infra-endpoints(headless Service + Endpoints)를 걷어냈다.
# config-repo ConfigMap 3개는 여기 없다 — modu_platform 루트 kustomization 을 Argo CD Application modu-config-repo 가 적용한다(2026-10-04, k8s/cicd/argocd).
#   Argo 없이 손으로 올릴 때: kubectl apply -k ~/workspace/modu_platform
# Secret 은 여기 없다: config-service(secret.example.yaml), infra·mongo-keyfile·mysqld-exporter(../../create-infra-secret.sh) — README.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: modu

resources:
  - ../../base
  - loadbalancers.yaml
  - storageclass.yaml     # Colima(k3s)용 StorageClass `standard` (2026-10-06)

# 이미지 태그. base 는 develop(브랜치 롤링 태그). CI 가 올린 태그(예: sha-…)로 바꿔 apply 하면 그 Deployment 만 롤아웃된다.
images:
  - name: ghcr.io/tear94fall/modu-platform/config-service
    newTag: develop
  - name: ghcr.io/tear94fall/modu-platform/gateway-service
    newTag: develop-e32b2e5
  - name: ghcr.io/tear94fall/modu-platform/deploy-service
    newTag: develop-e32b2e5
  - name: ghcr.io/tear94fall/modu-chat/auth-service
    newTag: develop
  - name: ghcr.io/tear94fall/modu-chat/member-service
    newTag: develop
  - name: ghcr.io/tear94fall/modu-chat/chat-service
    newTag: develop
  - name: ghcr.io/tear94fall/modu-chat/chat-store-service
    newTag: develop
  - name: ghcr.io/tear94fall/modu-chat/ws-service
    newTag: develop
  - name: ghcr.io/tear94fall/modu-chat/push-service
    newTag: develop
  - name: ghcr.io/tear94fall/modu-chat/storage-service
    newTag: develop-5708871  # AWS SDK v2 + Ceph RGW (modu_chat #423). 움직이는 태그(develop)는 노드의 옛 MinIO 이미지가 쓰인다 — 항상 커밋 태그로
  - name: ghcr.io/tear94fall/modu-chat/profile-service
    newTag: develop
  - name: ghcr.io/tear94fall/modu-chat/point-service
    newTag: develop-35db83f
  - name: ghcr.io/tear94fall/modu-chat/schedule-service
    newTag: develop-35db83f
  - name: ghcr.io/tear94fall/modu-commerce/commerce-service
    newTag: develop-66c1242
  - name: ghcr.io/tear94fall/modu-commerce/web
    newTag: develop-23fc7a4  # 움직이는 태그(develop)는 imagePullPolicy IfNotPresent 때문에 노드의 옛 이미지가 쓰인다 — 항상 커밋 태그로
  - name: ghcr.io/tear94fall/modu-admin/modu-admin
    newTag: develop-5884a31  # 움직이는 태그(develop)는 imagePullPolicy IfNotPresent 때문에 노드의 옛 이미지가 쓰인다 — 항상 커밋 태그로
  - name: ghcr.io/tear94fall/modu-admin/modu-system
    newTag: develop-ab00955  # 움직이는 태그(develop)는 imagePullPolicy IfNotPresent 때문에 노드의 옛 이미지가 쓰인다 — 항상 커밋 태그로
  - name: ghcr.io/tear94fall/modu-admin/modu-internal
    newTag: develop-ab00955  # 움직이는 태그(develop)는 imagePullPolicy IfNotPresent 때문에 노드의 옛 이미지가 쓰인다 — 항상 커밋 태그로

# 복제 수. 1 노드라 gateway·config 만 2(롤링 재배포 때 끊기지 않게), 나머지는 1.
# 메모리 requests 합(JVM 14개×512Mi + nginx 4개×16Mi ≈ 7.1GiB)이 노드 allocatable 을 넘으면 Pending 이 된다 — Docker Desktop 메모리를 확인(README).
replicas:
  - name: config-service
    count: 1
  - name: gateway-service
    count: 1
  - name: deploy-service
    count: 1
  - name: auth-service
    count: 1
  - name: member-service
    count: 1
  - name: chat-service
    count: 1
  - name: chat-store-service
    count: 1
  - name: ws-service
    count: 1
  - name: push-service
    count: 1
  - name: storage-service
    count: 1
  - name: profile-service
    count: 1
  - name: point-service
    count: 1
  - name: schedule-service
    count: 1
  - name: commerce-service
    count: 1
  - name: modu-commerce-web
    count: 1
  - name: modu-admin
    count: 1
  - name: modu-system
    count: 1
  - name: modu-internal
    count: 1
  # Pinpoint 스택 — dev 에선 꺼 둠(아래 patches 주석 참고). PVC(pinpoint-hbase-data, pinpoint-mysql)는 남아 있어 켜면 데이터가 이어진다.
  - name: zoo1
    count: 0
  - name: pinpoint-hbase
    count: 0
  - name: pinpoint-mysql
    count: 0
  - name: pinpoint-redis
    count: 0
  - name: pinpoint-collector
    count: 0
  - name: pinpoint-web
    count: 0

# Pinpoint — dev 에선 2026-10-04 부터 꺼 둔다(결정: APM 은 운영 환경에서만, dev 는 필요할 때 켠다). 메모리 상한 약 4.6GiB 를 비워
# Argo CD·GoCD 자리로 쓴다. 켜는 법은 README "Pinpoint 켜기/끄기". 아래 patches 를 되살리고 replicas 의 Pinpoint 6개를 1 로.
# 에이전트 패치를 되살리면 JVM 13개 템플릿이 한꺼번에 바뀌므로 README 의 "롤아웃은 한 번에 하나씩" 절차로 apply 할 것.
