# dev 는 2026-10-06 부터 Colima(k3s) 위에서 돈다. k3s 의 기본 StorageClass 이름은 local-path 인데 base 의 PVC 템플릿은 Docker Desktop 시절 이름
# `standard` 를 쓰므로(29곳), 같은 provisioner(rancher.io/local-path)로 `standard` 를 하나 더 만든다 — base 는 손대지 않는다.
# 데이터는 VM 안 /var/lib/rancher/k3s/storage/ 에 남는다(colima delete 하면 사라진다 — 백업은 ~/modu-data/backup).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: standard
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
