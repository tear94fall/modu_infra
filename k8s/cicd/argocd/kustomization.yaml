# Argo CD (GitOps 컨트롤러) — 네임스페이스 argocd. 공식 cluster-install 매니페스트(버전 고정)에 dev 용 패치만 얹는다.
#   설치:  kubectl apply -k k8s/cicd/argocd      (CRD 가 커서 첫 apply 는 server-side 로: kubectl apply --server-side -k …)
#   UI:    http://localhost:8090  (admin / `kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d`)
#   Application 들은 applications.yaml (modu-dev = modu_infra k8s/overlays/dev, modu-config-repo = modu_platform 루트 kustomization).
# 뺀 것: dex(SSO 없음), notifications, applicationset — replicas 0(메모리). 쓰게 되면 1 로.
# 동기화는 수동(버튼) — 머지해도 Sync 를 눌러야 적용된다. self-heal 은 Argo 에서 자동 동기화의 하위 옵션이라 수동 모드엔 없다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - https://github.com/argoproj/argo-cd/manifests/cluster-install?ref=v3.5.3
  - loadbalancer.yaml
  - applications.yaml

patches:
  # NetworkPolicy 7개 제거. Docker Desktop(kind) 의 kindnet 은 NetworkPolicy 를 nftables queue 로 강제하는데 그 verdict 가 "netlink send: i/o timeout" 으로
  # 실패하면 정책에 걸린 파드(Argo 7개)로 가는 파드→파드 패킷이 전부 버려진다(2026-10-04 실제: UI 8090 먹통, 노드→NodePort 만 됨). 1 노드 dev 에선 정책이 주는 게 없다.
  - target: {kind: NetworkPolicy}
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: ignored
  # HTTP(자체 서명 TLS 없이). LoadBalancer 가 8080(http) 으로 바로 간다.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
  # 추적을 라벨 대신 annotation 으로(app.kubernetes.io/instance 라벨을 모든 객체에 덧붙이지 않는다 — Argo 권장).
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        application.resourceTrackingMethod: annotation
        timeout.reconciliation: 180s
        # 모두 시스템 배포 탭(deploy-service)용 로컬 계정. API 키만(로그인 불가). 토큰 발급: admin 으로 POST /api/v1/account/deploy/token →
        # config-repo/deploy-service.yml 의 deploy.argocd.token 에 {cipher} 로. 권한은 아래 argocd-rbac-cm(role:deployer — applications get·sync 만).
        accounts.deploy: apiKey
        accounts.deploy.enabled: "true"
        # PVC 가 Pending 이면 Argo 는 Progressing 으로 보고 sync-wave 가 다음 단계로 못 넘어간다. local-path 는 WaitForFirstConsumer 라
        # 쓰는 파드가 없는 PVC(예: Pinpoint 를 꺼 둔 pinpoint-hbase-data)는 영원히 Pending — 그걸 Healthy 로 친다(2026-10-06 Colima 이전 때 sync 가 멈췄다).
        resource.customizations.health.PersistentVolumeClaim: |
          hs = {}
          if obj.status ~= nil and obj.status.phase == "Bound" then hs.status = "Healthy"; hs.message = "Bound"; return hs end
          if obj.status ~= nil and obj.status.phase == "Pending" then hs.status = "Healthy"; hs.message = "Pending (WaitForFirstConsumer)"; return hs end
          hs.status = "Progressing"; hs.message = "unknown phase"; return hs
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-rbac-cm
      data:
        policy.default: ""
        # 배포 탭이 쓰는 Application 하나만 지정한다 — default/* 로 두면 이 토큰으로 modu-ceph(스토리지)·modu-config-repo(설정)까지
        # sync 할 수 있다. AppProject 는 default 하나뿐이라 프로젝트로 가르는 대신 이름으로 좁힌다.
        policy.csv: |
          p, role:deployer, applications, get, default/modu-dev, allow
          p, role:deployer, applications, sync, default/modu-dev, allow
          g, deploy, role:deployer
  - target: {kind: Deployment, name: argocd-dex-server}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target: {kind: Deployment, name: argocd-notifications-controller}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target: {kind: Deployment, name: argocd-applicationset-controller}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # 메모리 상한(1 노드 dev). 합계 limits ≈ 1.1GiB, requests ≈ 300MiB.
  - target: {kind: Deployment, name: argocd-server}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {memory: 64Mi, cpu: 50m}, limits: {memory: 256Mi}}
  - target: {kind: Deployment, name: argocd-repo-server}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {memory: 128Mi, cpu: 50m}, limits: {memory: 512Mi}}
  - target: {kind: StatefulSet, name: argocd-application-controller}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {memory: 128Mi, cpu: 100m}, limits: {memory: 512Mi}}
  - target: {kind: Deployment, name: argocd-redis}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {memory: 16Mi, cpu: 10m}, limits: {memory: 128Mi}}
