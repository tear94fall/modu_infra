# Mac 에서 Argo CD UI/API 로 들어오는 입구(Docker Desktop 은 LoadBalancer 를 localhost 로 연다). http://localhost:8090
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-lb
  labels:
    app.kubernetes.io/name: argocd-server
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: http
      port: 8090
      targetPort: 8080
