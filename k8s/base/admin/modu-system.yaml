apiVersion: apps/v1
kind: Deployment
metadata:
  name: modu-system
  labels:
    app: modu-system
    app.kubernetes.io/name: modu-system
    app.kubernetes.io/component: admin
spec:
  # 파드는 같은 이름의 Rollout(아래, workloadRef)이 가진다 — 이 Deployment 는 파드 템플릿(이미지 태그·env·프로브)만 담는다. 2026-11-15 카나리 배포.
  replicas: 0
  selector:
    matchLabels:
      app: modu-system
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: modu-system
        app.kubernetes.io/name: modu-system
        app.kubernetes.io/component: admin
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: false
      containers:
      - name: modu-system
        image: ghcr.io/tear94fall/modu-admin/modu-system:develop
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        # nginx 의 resolver 는 search 도메인을 안 써서 upstream 은 FQDN 이어야 한다(이미지 기본값은 짧은 이름 — compose 용).
        env:
        - name: GATEWAY_HOST
          value: "gateway-service.modu.svc.cluster.local"
        # nginx.conf.template 의 upstream 은 gateway-service:8000(과 storage-service:9999)을 이름으로 resolve 한다 — Service 이름이 같다.
        # resolver 는 NGINX_ENTRYPOINT_LOCAL_RESOLVERS 로 파드의 /etc/resolv.conf(클러스터 DNS)에서 읽는다.
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
          timeoutSeconds: 3
        resources:
          requests:
            memory: 16Mi
            cpu: 50m
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: modu-system
  labels:
    app: modu-system
    app.kubernetes.io/name: modu-system
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  selector:
    app: modu-system
  ports:
  - name: http
    port: 80
    targetPort: http
---
# Rollout(Argo Rollouts): 위 Deployment 를 파드 템플릿으로 참조(workloadRef)해 파드 1개를 굴린다. 배포 탭이 Deployment 의 이미지 태그를 바꾸면(kustomize images + Argo Sync)
# 컨트롤러가 새 ReplicaSet 을 띄운다. 단계(steps)는 파드 수에서 k8s/rollouts/steps.sh 가 만든 것 — replicas 를 바꾸면 steps 도 다시 만들고 rollouts/check.sh 로 확인.
# 단계가 비어 있으면 지금의 롤링(maxSurge 1, maxUnavailable 0)과 같다. 진행/중단은 deploy-service 가 status 를 패치한다(모두 시스템 배포 탭).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: modu-system
  labels:
    app: modu-system
    app.kubernetes.io/name: modu-system
    app.kubernetes.io/component: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: modu-system
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: modu-system
    scaleDown: onsuccess
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps: []
