# 로그 인덱스 수명 관리(ISM) + dev 샤드 설정. 한 번만 돌면 되는 Job(멱등) — 클러스터를 다시 만들어도 같은 스크립트가 맞춘다.
# 왜 필요한가:
#  - 인덱스가 고정 이름(modu-app-logs, modu-infra-logs)이라 **영원히 커졌다**. 지우는 장치가 없었다.
#  - 단일 노드인데 replicas=1 이라 샤드 2개가 영구 unassigned → 클러스터 health 가 **절대 green 이 안 된다**(알림 입력으로 못 쓴다).
# 어떻게:
#  - 정책 modu-logs: 1일(또는 주 샤드 5GB)마다 롤오버, 인덱스 나이 14일이면 삭제.
#  - 인덱스 템플릿: 샤드 1 / 복제 0 + 롤오버 별칭(dev 는 노드가 하나라 복제본을 둘 곳이 없다 — 운영이면 노드 수에 맞춘다). OTel 컬렉터는 그대로 modu-app-logs 로 쓴다 — 그 이름이 이제 **별칭**이다.
#  - 처음 돌 때 옛 고정 인덱스가 있으면 modu-*-logs-000001 로 reindex 하고 지운 뒤 별칭을 건다(로그를 버리지 않는다).
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-ism
  labels:
    app.kubernetes.io/name: opensearch-ism
    app.kubernetes.io/component: observability
data:
  policy.json: |
    {
      "policy": {
        "description": "modu dev 로그: 1일마다 롤오버, 14일 뒤 삭제",
        "default_state": "hot",
        "states": [
          {
            "name": "hot",
            "actions": [{"rollover": {"min_index_age": "1d", "min_primary_shard_size": "5gb"}}],
            "transitions": [{"state_name": "delete", "conditions": {"min_index_age": "14d"}}]
          },
          {"name": "delete", "actions": [{"delete": {}}], "transitions": []}
        ],
        "ism_template": [{"index_patterns": ["modu-app-logs-*", "modu-infra-logs-*"], "priority": 100}]
      }
    }
  run.sh: |
    set -eu
    OS=http://opensearch:9200
    code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
    until [ "$(code "$OS/_cluster/health")" = 200 ]; do echo "  opensearch 기다림"; sleep 3; done

    # 1) ISM 정책 — 있으면 그대로 둔다(PUT 은 버전 충돌이 난다)
    if [ "$(code "$OS/_plugins/_ism/policies/modu-logs")" = 200 ]; then
      echo "▶ 정책 modu-logs 이미 있음"
    else
      echo "▶ 정책 modu-logs 생성"
      curl -sS -XPUT "$OS/_plugins/_ism/policies/modu-logs" -H 'Content-Type: application/json' -d @/conf/policy.json > /dev/null
    fi

    # 2) 인덱스 템플릿 — 시리즈마다 롤오버 별칭이 달라 둘로 나눈다
    for s in modu-app-logs modu-infra-logs; do
      echo "▶ 템플릿 $s"
      curl -sS -XPUT "$OS/_index_template/$s" -H 'Content-Type: application/json' -d "{
        \"index_patterns\": [\"$s-*\"],
        \"template\": {\"settings\": {
          \"number_of_shards\": 1,
          \"number_of_replicas\": 0,
          \"index.plugins.index_state_management.rollover_alias\": \"$s\"
        }}
      }" > /dev/null
    done

    # 3) 쓰기 대상(별칭) 준비
    for s in modu-app-logs modu-infra-logs; do
      if [ "$(code "$OS/_alias/$s")" = 200 ]; then echo "▶ 별칭 $s 이미 있음"; continue; fi
      if [ "$(code "$OS/$s")" = 200 ]; then
        echo "▶ 옛 고정 인덱스 $s → $s-000001 로 옮김(reindex)"
        curl -sS -XPOST "$OS/_reindex?wait_for_completion=true&refresh=true" -H 'Content-Type: application/json' \
          -d "{\"source\": {\"index\": \"$s\"}, \"dest\": {\"index\": \"$s-000001\"}}" | head -c 300; echo
        curl -sS -XDELETE "$OS/$s" > /dev/null
      else
        echo "▶ 첫 인덱스 $s-000001 생성"
        curl -sS -XPUT "$OS/$s-000001" -H 'Content-Type: application/json' -d '{}' > /dev/null
      fi
      curl -sS -XPOST "$OS/_aliases" -H 'Content-Type: application/json' \
        -d "{\"actions\": [{\"add\": {\"index\": \"$s-000001\", \"alias\": \"$s\", \"is_write_index\": true}}]}" > /dev/null
    done

    # 4) 복제본을 0 으로(단일 노드에서 green 이 되도록). ISM 플러그인이 만드는 설정 인덱스도 기본이 replicas 1 이라 같이 내린다.
    echo "▶ replicas 0"
    curl -sS -XPUT "$OS/modu-*/_settings" -H 'Content-Type: application/json' -d '{"index": {"number_of_replicas": 0}}' > /dev/null
    for i in .opendistro-ism-config .opensearch-sap-log-types-config; do
      [ "$(code "$OS/$i")" = 200 ] && curl -sS -XPUT "$OS/$i/_settings" -H 'Content-Type: application/json' -d '{"index": {"number_of_replicas": 0}}' > /dev/null || true
    done

    echo "▶ 결과"
    curl -s "$OS/_cat/indices/modu-*?v&h=health,index,pri,rep,docs.count,store.size"
    curl -s "$OS/_cat/aliases/modu-*?v&h=alias,index,is_write_index"
    curl -s "$OS/_cluster/health?filter_path=status,unassigned_shards"; echo
---
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-ism-init
  labels:
    app: opensearch-ism-init
    app.kubernetes.io/name: opensearch-ism-init
    app.kubernetes.io/component: observability
  annotations:
    # 인프라(wave 0) 다음, 앱보다 먼저. Argo 는 완료된 Job 의 spec 을 비교하지 않는다(README "Argo CD").
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: opensearch-ism-init
        app.kubernetes.io/name: opensearch-ism-init
        app.kubernetes.io/component: observability
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
      - name: ism
        image: curlimages/curl:8.11.1
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/conf/run.sh"]
        volumeMounts:
        - {name: conf, mountPath: /conf}
        resources:
          requests: {memory: 16Mi, cpu: 10m}
          limits: {memory: 64Mi}
      volumes:
      - name: conf
        configMap:
          name: opensearch-ism
