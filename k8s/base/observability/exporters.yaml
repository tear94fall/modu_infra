# mongodb-exporter: compose 는 --mongodb.uri=${MONGODB_URI} 인자였다. exporter 가 MONGODB_URI env 를 같은 플래그로 읽으므로 Secret 에서 env 로 준다(인자에 비밀번호가 안 보인다).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-exporter
  labels:
    app: mongodb-exporter
    app.kubernetes.io/name: mongodb-exporter
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-exporter
  template:
    metadata:
      labels:
        app: mongodb-exporter
        app.kubernetes.io/name: mongodb-exporter
        app.kubernetes.io/component: observability
    spec:
      enableServiceLinks: false
      containers:
      - name: mongodb-exporter
        image: percona/mongodb_exporter:0.40
        imagePullPolicy: IfNotPresent
        args:
        - "--collect-all"
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: infra
              key: MONGODB_URI
        ports:
        - name: metrics
          containerPort: 9216
        readinessProbe:
          tcpSocket:
            port: metrics
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 30
          failureThreshold: 3
        resources:
          requests:
            memory: 16Mi
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-exporter
  labels:
    app: mongodb-exporter
    app.kubernetes.io/name: mongodb-exporter
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app: mongodb-exporter
  ports:
  - name: metrics
    port: 9216
    targetPort: metrics
---
