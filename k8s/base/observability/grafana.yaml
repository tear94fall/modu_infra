# Grafana(grafana/grafana:13.2.0). 대시보드 JSON 은 kustomization.yaml 의 configMapGenerator(grafana/dashboards/*.json).
# monitoring/grafana/provisioning 의 datasources/prometheus.yml(http://prometheus:9090) + dashboards/dashboards.yml 그대로.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels:
    app: grafana-provisioning
    app.kubernetes.io/name: grafana-provisioning
    app.kubernetes.io/component: observability
data:
  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: default
        orgId: 1
        folder: modu-messenger
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards/json
          foldersFromFilesStructure: false
---
# /etc/grafana/provisioning 을 compose 의 디렉터리 모양 그대로(datasources/, dashboards/, dashboards/json/) projected 볼륨으로 만든다.
# 관리자 계정은 Secret infra 의 GRAFANA_USER / GRAFANA_PASSWORD(monitoring/.env). dev 오버레이가 LoadBalancer 3000 으로 연다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
spec:
  serviceName: grafana
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: observability
    spec:
      enableServiceLinks: false
      volumes:
      - name: provisioning
        projected:
          sources:
          - configMap:
              name: grafana-provisioning
              items:
              - key: datasources.yml
                path: datasources/prometheus.yml
              - key: dashboards.yml
                path: dashboards/dashboards.yml
          - configMap:
              name: grafana-dashboards
              items:
              - key: cadvisor.json
                path: dashboards/json/cadvisor.json
              - key: kafka-exporter.json
                path: dashboards/json/kafka-exporter.json
              - key: modu-infra.json
                path: dashboards/json/modu-infra.json
              - key: modu-overview.json
                path: dashboards/json/modu-overview.json
              - key: modu-service.json
                path: dashboards/json/modu-service.json
          - configMap:
              name: grafana-dashboards-jvm
              items:
              - key: jvm-micrometer.json
                path: dashboards/json/jvm-micrometer.json
      containers:
      - name: grafana
        image: grafana/grafana:13.2.0
        imagePullPolicy: IfNotPresent
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: infra
              key: GRAFANA_USER
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: infra
              key: GRAFANA_PASSWORD
        ports:
        - name: http
          containerPort: 3000
        readinessProbe:
          httpGet:
            path: "/api/health"
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: "/api/health"
            port: http
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 384Mi
        volumeMounts:
        - name: provisioning
          mountPath: "/etc/grafana/provisioning"
          readOnly: true
        - name: data
          mountPath: "/var/lib/grafana"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: standard
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: http
