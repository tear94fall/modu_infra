# Prometheus(prom/prometheus:v3.14.0) + kubelet cAdvisor 를 긁기 위한 RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
---
# kubelet cAdvisor(nodes/proxy)와 kubernetes_sd(node) 용. 클러스터 범위라 이름에 modu- 를 붙인다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: modu-prometheus
  labels:
    app: modu-prometheus
    app.kubernetes.io/name: modu-prometheus
    app.kubernetes.io/component: observability
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - nodes/proxy
  - nodes/metrics
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch
- nonResourceURLs:
  - "/metrics"
  - "/metrics/cadvisor"
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: modu-prometheus
  labels:
    app: modu-prometheus
    app.kubernetes.io/name: modu-prometheus
    app.kubernetes.io/component: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: modu-prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: modu
---
# compose 시절 monitoring/prometheus/prometheus.yml 과 같은 잡·대상 이름(이제 k8s Service 로 풀린다; member-service 관리 포트 8082 는 member-service Service 에 있다).
# 빠진 것: node(node-exporter — 도커 호스트 지표, k8s 에는 안 옮겼다). cadvisor 는 kubelet 으로 바꿨다.
# 바꾼 뒤: kubectl apply -k 하고 kubectl -n modu exec prometheus-0 -- wget -qO- --post-data= http://localhost:9090/-/reload (ConfigMap 반영까지 ~1분)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]

      # 앱 서비스 전부(메신저·커머스·플랫폼). relabel 로 instance(이름:포트)에서 service 라벨을 뽑는다 — 커머스는 application 태그가 없고,
      # up 같은 합성 지표에는 application 이 없어서 대시보드는 service 로 묶는다. config-service 는 /actuator/prometheus 만 인증 없이 연다(2026-10-23).
      - job_name: modu-messenger
        metrics_path: /actuator/prometheus
        relabel_configs:
          - source_labels: [__address__]
            regex: ([^:]+):\d+
            target_label: service
        static_configs:
          - targets:
              - gateway-service:8000
              - deploy-service:8900
              - batch-service:8910
              - auth-service:9900
              - member-service:8082
              - chat-service:9090
              - profile-service:8880
              - push-service:9990
              - storage-service:9999
              - ws-service:8090
              - chat-store-service:8100
              - config-service:8888
              - point-service:9600
              - commerce-service:8200

      - job_name: mysql
        metrics_path: /probe
        params:
          auth_module: [client]
        static_configs:
          - targets:
              - mysql-member:3306
              - mysql-chat:3306
              - mysql-push:3306
              - mysql-profile:3306
              - mysql-member-replica:3306
              - mysql-chat-replica:3306
              - mysql-push-replica:3306
              - mysql-profile-replica:3306
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: mysqld-exporter:9104

      # mysql-commerce 는 root 비밀번호가 messenger 쪽 MySQL 과 달라 .my.cnf 의 별도 섹션을 쓴다.
      - job_name: mysql-commerce
        metrics_path: /probe
        params:
          auth_module: [client.commerce]
        static_configs:
          - targets:
              - mysql-commerce:3306
              - mysql-commerce-replica:3306
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: mysqld-exporter:9104

      # mysql-platform 도 root 비밀번호가 따로(PLATFORM_DB_PASSWORD, .my.cnf [client.platform]). 복제본까지 — 복제 지연이 상태판에 나온다.
      - job_name: mysql-platform
        metrics_path: /probe
        params:
          auth_module: [client.platform]
        static_configs:
          - targets:
              - mysql-platform:3306
              - mysql-platform-replica:3306
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: mysqld-exporter:9104

      # 컨테이너 지표: compose 의 cadvisor 컨테이너 대신 kubelet 내장 cAdvisor 를 API 서버 프록시로 긁는다
      # (/api/v1/nodes/<node>/proxy/metrics/cadvisor — ServiceAccount prometheus 의 ClusterRole 이 nodes/proxy 를 허용).
      # 라벨이 도커 cadvisor(name=컨테이너 이름)와 달리 namespace·pod·container 다.
      - job_name: cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

      - job_name: redis
        static_configs:
          - targets: [redis-exporter:9121]

      - job_name: mongodb
        static_configs:
          - targets: [mongodb-exporter:9216]

      - job_name: kafka
        static_configs:
          - targets: [kafka-exporter:9308]

      - job_name: rabbitmq
        static_configs:
          - targets: [rabbitmq:15692]

      # JVM 이 아닌 우리 파드들 — cloudflared(터널 연결·요청·오류, dev 오버레이의 Service), otel-collector(로그 레코드 받음/보냄/실패).
      # 같은 service 라벨 규칙으로 상태판 표에 들어간다.
      - job_name: cloudflared
        relabel_configs:
          - source_labels: [__address__]
            regex: ([^:]+):\d+
            target_label: service
        static_configs:
          - targets: [cloudflared:2000]
      - job_name: otel-collector
        relabel_configs:
          - source_labels: [__address__]
            regex: ([^:]+):\d+
            target_label: service
        static_configs:
          - targets: [otel-collector:8888]

      # 쿠버네티스 상태(ready·재시작·이미지 태그·레플리카) — kube-state-metrics.yaml. 상태판이 쓴다.
      - job_name: kube-state-metrics
        static_configs:
          - targets: [kube-state-metrics:8080]

      # kubelet 자체 지표 중 PVC 사용량(kubelet_volume_stats_*)만 — cadvisor 와 같은 API 서버 프록시 경로. 나머지는 버린다(카디널리티).
      - job_name: kubelet
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: kubelet_volume_stats_(used|capacity|available)_bytes
            action: keep
---
# dev 오버레이가 LoadBalancer 19090 → 9090 으로 연다(compose 호스트 포트 그대로).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: observability
    spec:
      enableServiceLinks: false
      serviceAccountName: prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v3.14.0
        imagePullPolicy: IfNotPresent
        args:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--web.enable-lifecycle"
        ports:
        - name: http
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: "/-/ready"
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: "/-/healthy"
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: config
          mountPath: "/etc/prometheus"
        - name: data
          mountPath: "/prometheus"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: standard
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
