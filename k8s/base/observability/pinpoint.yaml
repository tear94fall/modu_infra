# Pinpoint APM 서버 — compose 시절(pinpoint-docker/docker-compose.yml + override, .env 의 PINPOINT_VERSION=latest — 2026-10-04 삭제)에서 실제로 쓰던 것만:
# hbase, mysql, redis(→ pinpoint-redis), zookeeper(zoo1 한 대), collector, web. batch·flink·quickstart·agent 는 compose 에서도 꺼져 있어 뺐다.
# 이미지 태그 latest 는 compose 그대로 — imagePullPolicy IfNotPresent 로 노드에 있는 것을 쓴다(Always 면 매번 레지스트리로 간다).
# 비밀번호는 Secret infra 의 PINPOINT_* 키(k8s/infra.env. compose 시절 pinpoint-docker/.env 의 같은 이름에 PINPOINT_ 접두사 — data/.env 의 MYSQL_ROOT_PASSWORD 와 이름이 겹쳐서).
# zoo1: Pinpoint 전용 ZooKeeper 한 대(compose 는 zoo1..3 앙상블). ZOO_SERVERS 를 안 줘서 단독(standalone) 모드. compose 도 이름 있는 볼륨이 없어 emptyDir.
# collector·web 의 PINPOINT_ZOOKEEPER_ADDRESS=zoo1, HBase 의 hbase.zookeeper.quorum=zoo1(아래 hbase-site.xml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoo1
  labels:
    app: zoo1
    app.kubernetes.io/name: zoo1
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zoo1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: zoo1
        app.kubernetes.io/name: zoo1
        app.kubernetes.io/component: observability
    spec:
      enableServiceLinks: false
      volumes:
      - name: data
        emptyDir: {}
      - name: datalog
        emptyDir: {}
      containers:
      - name: zookeeper
        image: zookeeper:3.4.13
        imagePullPolicy: IfNotPresent
        env:
        - name: ZOO_MY_ID
          value: '1'
        - name: JVMFLAGS
          value: "-Xmx128m"
        ports:
        - name: client
          containerPort: 2181
        readinessProbe:
          tcpSocket:
            port: client
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: client
          initialDelaySeconds: 20
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: "/data"
        - name: datalog
          mountPath: "/datalog"
---
apiVersion: v1
kind: Service
metadata:
  name: zoo1
  labels:
    app: zoo1
    app.kubernetes.io/name: zoo1
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app: zoo1
  ports:
  - name: client
    port: 2181
    targetPort: client
---
# 이미지의 conf/hbase-site.xml 과 같고 hbase.zookeeper.quorum 만 zoo1,zoo2,zoo3 → zoo1(zoo2·zoo3 는 안 옮겼다 — 풀리지 않는 이름이 있으면 ZK 클라이언트가 실패한다).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pinpoint-hbase
  labels:
    app: pinpoint-hbase
    app.kubernetes.io/name: pinpoint-hbase
    app.kubernetes.io/component: observability
data:
  hbase-site.xml: |
    <configuration>
        <property>
            <name>hbase.rootdir</name>
            <value>file:///home/pinpoint/hbase</value>
        </property>
        <property>
            <name>hbase.cluster.distributed</name>
            <value>true</value>
        </property>
        <property>
            <name>zookeeper.znode.parent</name>
            <value>/hbase</value>
        </property>
        <property>
            <name>hbase.zookeeper.quorum</name>
            <value>zoo1</value>
        </property>
        <property>
            <name>hbase.zookeeper.property.clientPort</name>
            <value>2181</value>
        </property>
        <property>
            <name>hbase.master.port</name>
            <value>60000</value>
        </property>
        <property>
            <name>hbase.regionserver.port</name>
            <value>16020</value>
        </property>
    </configuration>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pinpoint-hbase-data
  labels:
    app: pinpoint-hbase-data
    app.kubernetes.io/name: pinpoint-hbase-data
    app.kubernetes.io/component: observability
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
# pinpoint-hbase: StatefulSet 이 아니라 Deployment(Recreate) + PVC 인 이유 — HBase 는 자기 hostname 을 ZooKeeper 에 등록하고 collector·web 은
# 그 이름으로 붙는다. StatefulSet 은 파드 hostname 을 pinpoint-hbase-0 으로 강제해 아무도 못 푸는 이름이 등록된다. Deployment 는 spec.hostname
# 을 지켜서 등록 이름 = pinpoint-hbase = 이 Service 이름이 된다(파드 안에서는 /etc/hosts 로 자기 IP).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinpoint-hbase
  labels:
    app: pinpoint-hbase
    app.kubernetes.io/name: pinpoint-hbase
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pinpoint-hbase
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pinpoint-hbase
        app.kubernetes.io/name: pinpoint-hbase
        app.kubernetes.io/component: observability
    spec:
      enableServiceLinks: false
      hostname: pinpoint-hbase
      terminationGracePeriodSeconds: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pinpoint-hbase-data
      - name: zookeeper
        emptyDir: {}
      - name: hbase-site
        configMap:
          name: pinpoint-hbase
      containers:
      - name: pinpoint-hbase
        image: pinpointdocker/pinpoint-hbase:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: AGENTINFO_TTL
          value: '31536000'
        - name: AGENTSTATV2_TTL
          value: '5184000'
        - name: APPSTATAGGRE_TTL
          value: '5184000'
        - name: APPINDEX_TTL
          value: '31536000'
        - name: AGENTLIFECYCLE_TTL
          value: '5184000'
        - name: AGENTEVENT_TTL
          value: '5184000'
        - name: STRINGMETADATA_TTL
          value: '15552000'
        - name: APIMETADATA_TTL
          value: '31536000'
        - name: SQLMETADATA_TTL
          value: '15552000'
        - name: TRACEV2_TTL
          value: '5184000'
        - name: APPTRACEINDEX_TTL
          value: '5184000'
        - name: APPMAPSTATCALLERV2_TTL
          value: '5184000'
        - name: APPMAPSTATCALLEV2_TTL
          value: '5184000'
        - name: APPMAPSTATSELFV2_TTL
          value: '5184000'
        - name: HOSTAPPMAPV2_TTL
          value: '5184000'
        ports:
        - name: master
          containerPort: 60000
        - name: master-ui
          containerPort: 16010
        - name: regionserver
          containerPort: 16020
        - name: rs-ui
          containerPort: 16030
        startupProbe:
          tcpSocket:
            port: regionserver
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: regionserver
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: master
          periodSeconds: 30
          failureThreshold: 4
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: "/home/pinpoint/hbase"
        - name: zookeeper
          mountPath: "/home/pinpoint/zookeeper"
        - name: hbase-site
          mountPath: "/opt/hbase/hbase-2.2.6/conf/hbase-site.xml"
          subPath: hbase-site.xml
          readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: pinpoint-hbase
  labels:
    app: pinpoint-hbase
    app.kubernetes.io/name: pinpoint-hbase
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app: pinpoint-hbase
  ports:
  - name: master
    port: 60000
    targetPort: master
  - name: master-ui
    port: 16010
    targetPort: master-ui
  - name: regionserver
    port: 16020
    targetPort: regionserver
  - name: rs-ui
    port: 16030
    targetPort: rs-ui
---
# pinpoint-mysql: web 의 사용자·알람 설정 DB. compose 엔트리포인트는 매 기동마다 GitHub 에서 스키마 SQL 을 받았다(인터넷이 없으면 못 뜸).
# 여기서는 데이터 디렉터리가 비어 있을 때(최초 초기화)만 받는다 — 데이터를 옮겨 오면 인터넷 없이 뜬다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pinpoint-mysql
  labels:
    app: pinpoint-mysql
    app.kubernetes.io/name: pinpoint-mysql
    app.kubernetes.io/component: observability
spec:
  serviceName: pinpoint-mysql
  replicas: 1
  selector:
    matchLabels:
      app: pinpoint-mysql
  template:
    metadata:
      labels:
        app: pinpoint-mysql
        app.kubernetes.io/name: pinpoint-mysql
        app.kubernetes.io/component: observability
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: mysql
        image: mysql:8.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - "-ec"
        - |
          if [ ! -d /var/lib/mysql/mysql ]; then
            curl -fSL "https://raw.githubusercontent.com/pinpoint-apm/pinpoint/${PINPOINT_VERSION}/web/src/main/resources/sql/CreateTableStatement-mysql.sql" -o /docker-entrypoint-initdb.d/CreateTableStatement-mysql.sql
            curl -fSL "https://raw.githubusercontent.com/pinpoint-apm/pinpoint/${PINPOINT_VERSION}/web/src/main/resources/sql/SpringBatchJobRepositorySchema-mysql.sql" -o /docker-entrypoint-initdb.d/SpringBatchJobRepositorySchema-mysql.sql
            sed -i '/^--/d' /docker-entrypoint-initdb.d/CreateTableStatement-mysql.sql
            sed -i '/^--/d' /docker-entrypoint-initdb.d/SpringBatchJobRepositorySchema-mysql.sql
          fi
          exec docker-entrypoint.sh mysqld
        env:
        - name: PINPOINT_VERSION
          value: latest
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: infra
              key: PINPOINT_MYSQL_ROOT_PASSWORD
        - name: MYSQL_USER
          value: admin
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: infra
              key: PINPOINT_MYSQL_PASSWORD
        - name: MYSQL_DATABASE
          value: pinpoint
        ports:
        - name: mysql
          containerPort: 3306
        startupProbe:
          exec:
            command:
            - sh
            - "-c"
            - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - sh
            - "-c"
            - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 20
          failureThreshold: 6
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: "/var/lib/mysql"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: standard
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pinpoint-mysql
  labels:
    app: pinpoint-mysql
    app.kubernetes.io/name: pinpoint-mysql
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app: pinpoint-mysql
  ports:
  - name: mysql
    port: 3306
    targetPort: mysql
---
# pinpoint-redis: compose 의 pinpoint 프로젝트 서비스 redis(hostname pinpoint-redis). 볼륨 없음(compose 와 같음).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinpoint-redis
  labels:
    app: pinpoint-redis
    app.kubernetes.io/name: pinpoint-redis
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pinpoint-redis
  template:
    metadata:
      labels:
        app: pinpoint-redis
        app.kubernetes.io/name: pinpoint-redis
        app.kubernetes.io/component: observability
    spec:
      enableServiceLinks: false
      containers:
      - name: redis
        image: redis:7.0.14
        imagePullPolicy: IfNotPresent
        ports:
        - name: redis
          containerPort: 6379
        readinessProbe:
          exec:
            command:
            - sh
            - "-c"
            - redis-cli ping | grep -q PONG
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: redis
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            memory: 32Mi
          limits:
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pinpoint-redis
  labels:
    app: pinpoint-redis
    app.kubernetes.io/name: pinpoint-redis
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app: pinpoint-redis
  ports:
  - name: redis
    port: 6379
    targetPort: redis
---
# pinpoint-collector: 앱 에이전트(overlays/dev/pinpoint-agent-patch*.yaml 의 -Dpinpoint.collector.ip=pinpoint-collector)가 9991~9993 gRPC 로 보낸다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinpoint-collector
  labels:
    app: pinpoint-collector
    app.kubernetes.io/name: pinpoint-collector
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pinpoint-collector
  template:
    metadata:
      labels:
        app: pinpoint-collector
        app.kubernetes.io/name: pinpoint-collector
        app.kubernetes.io/component: observability
    spec:
      enableServiceLinks: false
      containers:
      - name: pinpoint-collector
        image: pinpointdocker/pinpoint-collector:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: release
        - name: PINPOINT_ZOOKEEPER_ADDRESS
          value: zoo1
        - name: CLUSTER_ENABLE
          value: 'true'
        - name: LOGGING_LEVEL_ROOT
          value: INFO
        - name: FLINK_CLUSTER_ENABLE
          value: 'true'
        - name: FLINK_CLUSTER_ZOOKEEPER_ADDRESS
          value: zoo1
        - name: SPRING_DATA_REDIS_HOST
          value: pinpoint-redis
        - name: SPRING_DATA_REDIS_PORT
          value: '6379'
        - name: SPRING_DATA_REDIS_USERNAME
          value: default
        - name: SPRING_DATA_REDIS_PASSWORD
          value: ''
        ports:
        - name: grpc-agent
          containerPort: 9991
        - name: grpc-stat
          containerPort: 9992
        - name: grpc-span
          containerPort: 9993
        - name: base
          containerPort: 9994
        - name: stat
          containerPort: 9995
        - name: span
          containerPort: 9996
        - name: stat-udp
          containerPort: 9995
          protocol: UDP
        - name: span-udp
          containerPort: 9996
          protocol: UDP
        startupProbe:
          tcpSocket:
            port: grpc-agent
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: grpc-agent
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: grpc-agent
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pinpoint-collector
  labels:
    app: pinpoint-collector
    app.kubernetes.io/name: pinpoint-collector
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app: pinpoint-collector
  ports:
  - name: grpc-agent
    port: 9991
    targetPort: grpc-agent
  - name: grpc-stat
    port: 9992
    targetPort: grpc-stat
  - name: grpc-span
    port: 9993
    targetPort: grpc-span
  - name: base
    port: 9994
    targetPort: base
  - name: stat
    port: 9995
    targetPort: stat
  - name: span
    port: 9996
    targetPort: span
---
# UDP 9995/9996(옛 thrift 에이전트용)은 Service 를 나눈다. 같은 Service 에 같은 포트 번호의 TCP·UDP 를 같이 두면 client-side kubectl apply 가
# 패치를 못 만든다(ports 의 merge key 가 port 하나라 "$setElementOrder" 오류 — kubernetes/kubernetes#39188). 에이전트(gRPC)는 TCP 만 쓴다.
apiVersion: v1
kind: Service
metadata:
  name: pinpoint-collector-udp
  labels:
    app: pinpoint-collector-udp
    app.kubernetes.io/name: pinpoint-collector-udp
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app: pinpoint-collector
  ports:
  - name: stat-udp
    port: 9995
    targetPort: stat-udp
    protocol: UDP
  - name: span-udp
    port: 9996
    targetPort: span-udp
    protocol: UDP
---
# pinpoint-web: UI 는 컨테이너 8080(compose 도 호스트 18080 → 8080 — WEB_SERVER_PORT=18080 env 는 compose 그대로 넘기지만 실제로는 8080 에서 뜬다).
# dev 오버레이가 LoadBalancer 18080 → 8080 으로 연다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinpoint-web
  labels:
    app: pinpoint-web
    app.kubernetes.io/name: pinpoint-web
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pinpoint-web
  template:
    metadata:
      labels:
        app: pinpoint-web
        app.kubernetes.io/name: pinpoint-web
        app.kubernetes.io/component: observability
    spec:
      enableServiceLinks: false
      containers:
      - name: pinpoint-web
        image: pinpointdocker/pinpoint-web:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: WEB_SERVER_PORT
          value: '18080'
        - name: SPRING_PROFILES_ACTIVE
          value: release
        - name: PINPOINT_ZOOKEEPER_ADDRESS
          value: zoo1
        - name: CLUSTER_ENABLE
          value: 'true'
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: infra
              key: PINPOINT_ADMIN_PASSWORD
        - name: CONFIG_SENDUSAGE
          value: 'true'
        - name: LOGGING_LEVEL_ROOT
          value: INFO
        - name: CONFIG_SHOW_APPLICATIONSTAT
          value: 'true'
        - name: JDBC_DRIVERCLASSNAME
          value: com.mysql.jdbc.Driver
        - name: JDBC_URL
          value: jdbc:mysql://pinpoint-mysql:3306/pinpoint?characterEncoding=UTF-8
        - name: JDBC_USERNAME
          value: admin
        - name: JDBC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: infra
              key: PINPOINT_SPRING_DATASOURCE_HIKARI_PASSWORD
        - name: SPRING_DATASOURCE_HIKARI_JDBCURL
          value: jdbc:mysql://pinpoint-mysql:3306/pinpoint?characterEncoding=UTF-8
        - name: SPRING_DATASOURCE_HIKARI_USERNAME
          value: admin
        - name: SPRING_DATASOURCE_HIKARI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: infra
              key: PINPOINT_SPRING_DATASOURCE_HIKARI_PASSWORD
        - name: SPRING_METADATASOURCE_HIKARI_JDBCURL
          value: jdbc:mysql://pinpoint-mysql:3306/pinpoint?characterEncoding=UTF-8
        - name: SPRING_METADATASOURCE_HIKARI_USERNAME
          value: admin
        - name: SPRING_METADATASOURCE_HIKARI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: infra
              key: PINPOINT_SPRING_METADATASOURCE_HIKARI_PASSWORD
        - name: SPRING_DATA_REDIS_HOST
          value: pinpoint-redis
        - name: SPRING_DATA_REDIS_PORT
          value: '6379'
        - name: SPRING_DATA_REDIS_USERNAME
          value: default
        - name: SPRING_DATA_REDIS_PASSWORD
          value: ''
        - name: PINPOINT_MODULES_WEB_LOGIN
          value: ''
        - name: WEB_SECURITY_AUTH_USER
          valueFrom:
            secretKeyRef:
              name: infra
              key: PINPOINT_WEB_SECURITY_AUTH_USER
        - name: WEB_SECURITY_AUTH_ADMIN
          valueFrom:
            secretKeyRef:
              name: infra
              key: PINPOINT_WEB_SECURITY_AUTH_ADMIN
        - name: WEB_SECURITY_AUTH_JWT_SECRETKEY
          valueFrom:
            secretKeyRef:
              name: infra
              key: PINPOINT_WEB_SECURITY_AUTH_JWT_SECRETKEY
        ports:
        - name: http
          containerPort: 8080
        - name: cluster
          containerPort: 9997
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            memory: 384Mi
          limits:
            memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pinpoint-web
  labels:
    app: pinpoint-web
    app.kubernetes.io/name: pinpoint-web
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app: pinpoint-web
  ports:
  - name: http
    port: 8080
    targetPort: http
  - name: cluster
    port: 9997
    targetPort: cluster
