# k8s 파드 로그 → OpenSearch(opensearch.yaml, 같은 네임스페이스). compose 시절 monitoring/otel/otel-collector.yml(2026-10-04 삭제)과 같은 흐름을
# 노드마다 하나(DaemonSet)로: /var/log/pods 의 CRI 로그를 읽어(container 오퍼레이터가 형식 판별·k8s 메타데이터 추출) 앱 JSON 이면 필드를 풀고
# modu-app-logs 로 보낸다. compose 와 같은 필드: attributes.container(컨테이너 이름), attributes.project=k8s.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: observability
data:
  config.yaml: |
    receivers:
      filelog:
        # modu 네임스페이스 파드만. 자기 자신(otel-collector) 로그는 빼서 되먹임을 막는다.
        include: [/var/log/pods/modu_*/*/*.log]
        exclude: [/var/log/pods/modu_otel-collector-*/*/*.log]
        start_at: end
        include_file_path: true
        operators:
          - id: container
            type: container
            add_metadata_from_filepath: true
          - id: names
            type: move
            from: resource["k8s.container.name"]
            to: attributes.container
          - id: project
            type: add
            field: attributes.project
            value: k8s
          - id: route
            type: router
            routes:
              - output: app
                expr: 'body matches "^\\{\"@timestamp\".*\\}\\s*$"'
            default: done
          - id: app
            type: json_parser
            parse_from: body
            parse_to: attributes
            timestamp:
              parse_from: attributes["@timestamp"]
              layout_type: gotime
              layout: '2006-01-02T15:04:05.999999999Z07:00'
            severity:
              parse_from: attributes.level
          - id: app_message
            type: move
            from: attributes.message
            to: body
          - id: app_ts
            type: remove
            field: attributes["@timestamp"]
          - id: done
            type: noop
    processors:
      batch:
        timeout: 2s
      resource:
        attributes:
          - key: deployment.environment
            value: dev-k8s
            action: upsert
    exporters:
      opensearch:
        http:
          endpoint: http://opensearch:9200
        logs_index: modu-app-logs
    service:
      telemetry:
        logs:
          level: warn
      pipelines:
        logs:
          receivers: [filelog]
          processors: [resource, batch]
          exporters: [opensearch]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: observability
spec:
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.141.0
          args: ["--config=/conf/config.yaml"]
          # /var/log/pods 는 root 만 읽는다
          securityContext:
            runAsUser: 0
          resources:
            requests: {memory: 64Mi, cpu: 50m}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: conf
              mountPath: /conf
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: otel-collector
        - name: varlogpods
          hostPath:
            path: /var/log/pods
