# deploy-service(modu_platform): 모두 시스템 "배포" 탭의 백엔드 — GHCR 태그 조회, modu_infra 의 overlays/dev/kustomization.yaml 태그 커밋,
# Argo CD Sync(계정 deploy, role:deployer), Deployment 롤아웃 진행률. 설정(토큰 포함)은 config-repo/deploy-service.yml(modu_platform).
# k8s 에는 modu 네임스페이스의 Deployment·ReplicaSet·Pod 를 읽고, Rollout 은 읽기 + status 패치(카나리 진행/중단) — 적용은 Argo 가 한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-service
  labels:
    app: deploy-service
    app.kubernetes.io/component: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-service
  labels:
    app: deploy-service
    app.kubernetes.io/component: platform
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  # 카나리 배포(2026-11-15): Rollout 을 읽고, 진행/중단은 status 서브리소스 머지 패치(pauseConditions·promoteFull·abort).
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-service
  labels:
    app: deploy-service
    app.kubernetes.io/component: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deploy-service
subjects:
  - kind: ServiceAccount
    name: deploy-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-service
  annotations:
    # Argo CD sync-wave: JVM Deployment 는 한 번에 하나씩 롤아웃(앞 wave 가 Healthy 돼야 다음). 인프라·nginx 는 0(기본).
    argocd.argoproj.io/sync-wave: "14"
  labels:
    app: deploy-service
    app.kubernetes.io/name: deploy-service
    app.kubernetes.io/component: platform
spec:
  # 파드는 같은 이름의 Rollout(아래, workloadRef)이 가진다 — 이 Deployment 는 파드 템플릿(이미지 태그·env·프로브)만 담는다. 2026-11-15 카나리 배포.
  replicas: 0
  selector:
    matchLabels:
      app: deploy-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: deploy-service
        app.kubernetes.io/name: deploy-service
        app.kubernetes.io/component: platform
    spec:
      serviceAccountName: deploy-service
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: false
      containers:
      - name: deploy-service
        image: ghcr.io/tear94fall/modu-platform/deploy-service:develop
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8900
        env:
        - name: CONFIG_SERVER_URI
          value: "http://config-service:8888"
        # GitHub App 비밀키. config-repo(공개)에 두지 않고 Secret deploy-service 에서만 온다. 시크릿이 없으면 비어 들어와
        # 앱 자격을 쓰지 않는다(기동은 된다) — k8s/create-infra-secret.sh 가 k8s/deploy-github-app.pem 으로 만든다.
        - name: DEPLOY_GITHUB_APP_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: deploy-service
              key: GITHUB_APP_PRIVATE_KEY
              optional: true
        # Argo CD 로컬 계정 deploy 의 API 토큰. 역시 공개 저장소에 두지 않는다(권한은 modu-dev 의 get·sync 뿐 — cicd/argocd 의 argocd-rbac-cm).
        - name: DEPLOY_ARGOCD_TOKEN
          valueFrom:
            secretKeyRef:
              name: deploy-service
              key: ARGOCD_TOKEN
              optional: true
        # config-service 는 {cipher} 가 풀린 평문을 돌려주므로 인증을 요구한다. 설정을 받기 전이라 토큰은 config-repo 가 아니라
        # Secret config-service(INTERNAL_API_TOKEN)에서 환경변수로 받아 Spring Cloud Config 클라이언트가 Basic 비밀번호로 보낸다.
        - name: SPRING_CLOUD_CONFIG_USERNAME
          value: "modu"
        - name: SPRING_CLOUD_CONFIG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: config-service
              key: INTERNAL_API_TOKEN
        - name: JAVA_TOOL_OPTIONS
          value: "-Dprofiler.logback.logging.transactioninfo=true"
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8900
          periodSeconds: 5
          failureThreshold: 30
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8900
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8900
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 3
          timeoutSeconds: 3
        resources:
          requests:
            memory: 384Mi
            cpu: 100m
          # 2026-11-15: 배포가 Temporal 워크플로(modu_platform #43)가 되며 SDK(gRPC·워커 스레드·Jackson 2)가 붙어 working set 591Mi 로 640Mi 한도에 붙었다
          # (JVM heap 108 + nonheap 249, MaxRAMPercentage 75). 768Mi 로 올린다.
          limits:
            memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: deploy-service
  labels:
    app: deploy-service
    app.kubernetes.io/name: deploy-service
    app.kubernetes.io/component: platform
spec:
  selector:
    app: deploy-service
  ports:
  - name: http
    port: 8900
    targetPort: http
---
# Rollout(Argo Rollouts): 위 Deployment 를 파드 템플릿으로 참조(workloadRef)해 파드 1개를 굴린다. 배포 탭이 Deployment 의 이미지 태그를 바꾸면(kustomize images + Argo Sync)
# 컨트롤러가 새 ReplicaSet 을 띄운다. 단계(steps)는 파드 수에서 k8s/rollouts/steps.sh 가 만든 것 — replicas 를 바꾸면 steps 도 다시 만들고 rollouts/check.sh 로 확인.
# 단계가 비어 있으면 지금의 롤링(maxSurge 1, maxUnavailable 0)과 같다. 진행/중단은 deploy-service 가 status 를 패치한다(모두 시스템 배포 탭).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: deploy-service
  labels:
    app: deploy-service
    app.kubernetes.io/name: deploy-service
    app.kubernetes.io/component: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deploy-service
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deploy-service
    scaleDown: onsuccess
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps: []
