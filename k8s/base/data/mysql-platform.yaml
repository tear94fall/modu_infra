      labels:
        app: mysql-platform-replica
        app.kubernetes.io/name: mysql-platform-replica
        app.kubernetes.io/component: data
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: mysql
        image: mysql:8.0.32
        imagePullPolicy: IfNotPresent
        args:
        - mysqld
        - "--server-id=25"
        - "--log-bin=mysql-bin"
        - "--binlog-format=ROW"
        - "--gtid-mode=ON"
        - "--enforce-gtid-consistency=ON"
        - "--binlog-expire-logs-seconds=604800"
        env:
        - name: MYSQL_ROOT_HOST
          value: "%"
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: infra
              key: PLATFORM_DB_PASSWORD
        ports:
        - name: mysql
          containerPort: 3306
        startupProbe:
          exec:
            command:
            - sh
            - "-c"
            - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - sh
            - "-c"
            - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            memory: 256Mi
            cpu: 50m
          limits:
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: "/var/lib/mysql"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: standard
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-platform-replica
  labels:
    app: mysql-platform-replica
    app.kubernetes.io/name: mysql-platform-replica
    app.kubernetes.io/component: data
spec:
  selector:
    app: mysql-platform-replica
  ports:
  - name: mysql
    port: 3306
    targetPort: mysql
