# MySQL 10개 — compose 시절(data/docker-compose.yml, 2026-10-04 삭제)의 컨테이너 이름 = Service 이름(:3306). 이름이 정확히 mysql-member 여야 해서 인스턴스마다 replicas 1 StatefulSet.
# 메신저 4쌍(mysql:8.0.32, root=MYSQL_ROOT_PASSWORD, 앱 계정 user=MYSQL_USER_PASSWORD) + 커머스 1쌍(mysql:8.0.44, root=COMMERCE_DB_PASSWORD).
# compose 의 depends_on(레플리카는 소스가 healthy 뒤에)은 k8s 에 없다 — 레플리카는 그냥 같이 뜨고, 복제는 replica-setup.sh 가 건다.
# 비밀번호는 Secret infra(k8s/create-infra-secret.sh). 볼륨에 데이터가 있으면 MYSQL_* 초기화는 다시 일어나지 않는다.
# mysql-member: 쓰기 DB(소스). server-id 11, GTID + ROW binlog(레플리카·Debezium 용).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-member
  labels:
    app: mysql-member
    app.kubernetes.io/name: mysql-member
    app.kubernetes.io/component: data
spec:
  serviceName: mysql-member
  replicas: 1
  selector:
    matchLabels:
      app: mysql-member
  template:
    metadata:
      labels:
        app: mysql-member
        app.kubernetes.io/name: mysql-member
        app.kubernetes.io/component: data
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: mysql
        image: mysql:8.0.32
        imagePullPolicy: IfNotPresent
        args:
        - mysqld
        - "--server-id=11"
        - "--log-bin=mysql-bin"
        - "--binlog-format=ROW"
        - "--gtid-mode=ON"
        - "--enforce-gtid-consistency=ON"
        - "--binlog-expire-logs-seconds=604800"
        env:
        - name: MYSQL_DATABASE
          value: modu-chat
        - name: MYSQL_USER
          value: user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: infra
              key: MYSQL_USER_PASSWORD
        - name: MYSQL_ROOT_HOST
          value: "%"
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: infra
              key: MYSQL_ROOT_PASSWORD
        ports:
        - name: mysql
          containerPort: 3306
        startupProbe:
          exec:
            command:
            - sh
            - "-c"
            - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - sh
            - "-c"
            - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            memory: 384Mi
          limits:
            memory: 768Mi
        volumeMounts:
        - name: data
          mountPath: "/var/lib/mysql"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: standard
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-member
  labels:
    app: mysql-member
    app.kubernetes.io/name: mysql-member
    app.kubernetes.io/component: data
spec:
  type: ClusterIP
  selector:
    app: mysql-member
  ports:
  - name: mysql
    port: 3306
    targetPort: mysql
---
