# 클러스터 생성 1회(compose 의 redis-node-1 REDIS_CLUSTER_BOOTSTRAP 대신). 6노드가 PONG 하면, 슬롯이 하나도 없을 때만 create(이미 있으면 아무것도 안 한다).
# 노드 주소는 Service ClusterIP(= 각 노드가 광고하는 cluster-announce-ip). CLUSTER MEET 이 호스트 이름을 못 받아서 이름 대신 IP 로 넘긴다.
# Job 의 pod 템플릿은 불변이라 끝난 Job 은 그대로 둔다. 다시 돌리려면: kubectl -n modu delete job redis-cluster-init && kubectl apply -k overlays/dev
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
  labels:
    app: redis-cluster-init
    app.kubernetes.io/name: redis-cluster-init
    app.kubernetes.io/component: data
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: redis-cluster-init
        app.kubernetes.io/name: redis-cluster-init
        app.kubernetes.io/component: data
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: true
      containers:
      - name: init
        image: redis:7.4.11-alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - "-ec"
        - |
          hosts=""
          for n in 1 2 3 4 5 6; do
            eval ip="\${REDIS_NODE_${n}_SERVICE_HOST:-}"
            if [ -z "$ip" ]; then echo "REDIS_NODE_${n}_SERVICE_HOST 가 없다 — Service redis-node-${n} 먼저" >&2; exit 1; fi
            hosts="$hosts $ip:6379"
          done
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            ready=1
            for n in 1 2 3 4 5 6; do
              [ "$(timeout 3 redis-cli -h redis-node-$n ping 2>/dev/null)" = PONG ] || ready=0
            done
            [ "$ready" = 1 ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then echo "redis-node-1..6 가 300초 안에 PONG 하지 않았다" >&2; exit 1; fi
            sleep 2
          done
          if redis-cli -h redis-node-1 cluster info | grep -q '^cluster_slots_assigned:0'; then
            echo "creating cluster:$hosts"
            redis-cli --cluster create $hosts --cluster-replicas 1 --cluster-yes
          else
            echo "redis cluster already formed"
          fi
          redis-cli -h redis-node-1 cluster info | grep -E '^cluster_(state|slots_assigned|known_nodes)'
        resources:
          requests:
            memory: 16Mi
          limits:
            memory: 64Mi
