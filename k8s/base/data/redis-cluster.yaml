# Redis Cluster 6노드(마스터 3 + 레플리카 3, redis:7.4.11-alpine). auth-service·member-service 가 redis-node-1..6:6379 로 쓴다.
# compose 는 전용 네트워크의 고정 IP(10.90.0.11~16)를 cluster-announce-ip 로 광고했다 — nodes.conf 에 저장된 IP 로 서로를 찾기 때문.
# k8s 에서는 노드마다 ClusterIP Service 를 두고 그 IP 를 광고한다. ClusterIP 는 Service 를 지우지 않는 한 안 바뀌어서 파드가 재시작해도
# nodes.conf 의 IP 가 그대로 맞는다(파드 IP 는 바뀐다). 클라이언트에게는 호스트 이름(redis-node-N)을 광고한다(preferred-endpoint-type hostname).
# Service 는 파드보다 먼저 있어야 한다(service link env). kustomize 는 Service 를 워크로드보다 앞에 내보낸다.
# Service 를 지웠다 다시 만들면 ClusterIP 가 바뀐다 → 노드가 서로를 잃는다(그때는 PVC 를 지우고 redis-cluster-init 을 다시).
# redis-node-N: 자기 Service 의 ClusterIP 를 광고(service link env REDIS_NODE_N_SERVICE_HOST — 그래서 enableServiceLinks: true).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-node-1
  labels:
    app: redis-node-1
    app.kubernetes.io/name: redis-node-1
    app.kubernetes.io/component: data
spec:
  serviceName: redis-node-1
  replicas: 1
  selector:
    matchLabels:
      app: redis-node-1
  template:
    metadata:
      labels:
        app: redis-node-1
        app.kubernetes.io/name: redis-node-1
        app.kubernetes.io/component: data
    spec:
      enableServiceLinks: true
      containers:
      - name: redis
        image: redis:7.4.11-alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - "-ec"
        - |
          ip="${REDIS_NODE_1_SERVICE_HOST:-}"
          if [ -z "$ip" ]; then
            echo "REDIS_NODE_1_SERVICE_HOST 가 없다 — Service redis-node-1 이 파드보다 먼저 만들어져야 한다(재시작하면 잡힌다)" >&2
            exit 1
          fi
          exec redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --appendonly yes --cluster-node-timeout 5000 --cluster-announce-ip "$ip" --cluster-announce-port 6379 --cluster-announce-bus-port 16379 --cluster-announce-hostname redis-node-1 --cluster-preferred-endpoint-type hostname
        ports:
        - name: redis
          containerPort: 6379
        - name: cluster-bus
          containerPort: 16379
        readinessProbe:
          exec:
            command:
            - sh
            - "-c"
            - redis-cli ping | grep -q PONG
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
        livenessProbe:
          tcpSocket:
            port: redis
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: data
          mountPath: "/data"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: standard
      resources:
        requests:
          storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-node-1
  labels:
    app: redis-node-1
    app.kubernetes.io/name: redis-node-1
    app.kubernetes.io/component: data
spec:
  type: ClusterIP
  selector:
    app: redis-node-1
  ports:
  - name: redis
    port: 6379
    targetPort: redis
  - name: cluster-bus
    port: 16379
    targetPort: cluster-bus
