# OTel Collector: 도커 컨테이너 로그(json-file) → OpenSearch. k8s 에선 같은 구성을 DaemonSet 로 옮기고 include 만 /var/log/pods 로 바꾼다.
# 인덱스는 둘: 앱 스택(compose 프로젝트 modu-messenger·modu-platform·modu-commerce·modu_admin) → modu-app-logs,
# 인프라 스택(modu-data·monitoring·pinpoint …) → modu-infra-logs. 앱 컨테이너의 JSON 이 아닌 줄(JVM 경고 등)도 앱 인덱스에 간다.
# 컨테이너·프로젝트 이름은 compose 의 logging.options.labels 가 줄마다 붙여 주는 attrs 에서 가져온다(container·project 필드).
receivers:
  filelog:
    include: [/var/lib/docker/containers/*/*-json.log]
    start_at: end
    include_file_path: false
    operators:
      # 1) 도커 json-file 한 줄: {"log":"...","stream":"stdout","time":"..."}
      - id: docker
        type: json_parser
        parse_to: attributes
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%LZ'
      - id: unwrap
        type: move
        from: attributes.log
        to: body
      - id: drop_time
        type: remove
        field: attributes.time
      # compose 가 붙인 라벨(attrs.com.docker.compose.service) → container. 라벨이 없는 컨테이너는 파일 이름(컨테이너 id)만 남는다.
      - id: container_name
        type: move
        from: attributes.attrs["com.docker.compose.service"]
        to: attributes.container
        if: 'attributes.attrs != nil and attributes.attrs["com.docker.compose.service"] != nil'
      - id: project_name
        type: move
        from: attributes.attrs["com.docker.compose.project"]
        to: attributes.project
        if: 'attributes.attrs != nil and attributes.attrs["com.docker.compose.project"] != nil'
      - id: drop_attrs
        type: remove
        field: attributes.attrs
        if: 'attributes.attrs != nil'
      # 2) 앱 로그(LogstashEncoder 한 줄 JSON)면 필드를 풀고, 아니면 그대로 둔다
      - id: route
        type: router
        routes:
          - output: app
            expr: 'body matches "^\\{\"@timestamp\".*\\}\\s*$"'
        default: done
      - id: app
        type: json_parser
        parse_from: body
        parse_to: attributes
        timestamp:
          parse_from: attributes["@timestamp"]
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
        severity:
          parse_from: attributes.level
      - id: app_message
        type: move
        from: attributes.message
        to: body
      - id: app_ts
        type: remove
        field: attributes["@timestamp"]
      - id: done
        type: noop

processors:
  batch:
    timeout: 2s
  resource:
    attributes:
      - key: deployment.environment
        value: dev
        action: upsert
  # 앱 스택 컨테이너의 줄만 남긴다
  filter/app:
    logs:
      log_record:
        - 'attributes["project"] == nil or not IsMatch(attributes["project"], "^(modu-messenger|modu-platform|modu-commerce|modu[-_]admin)$")'
  # 앱 스택이 아닌 줄만 남긴다
  filter/infra:
    logs:
      log_record:
        - 'attributes["project"] != nil and IsMatch(attributes["project"], "^(modu-messenger|modu-platform|modu-commerce|modu[-_]admin)$")'

exporters:
  opensearch/app:
    http:
      endpoint: http://opensearch:9200
    logs_index: modu-app-logs
  opensearch/infra:
    http:
      endpoint: http://opensearch:9200
    logs_index: modu-infra-logs

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    logs/app:
      receivers: [filelog]
      processors: [filter/app, resource, batch]
      exporters: [opensearch/app]
    logs/infra:
      receivers: [filelog]
      processors: [filter/infra, resource, batch]
      exporters: [opensearch/infra]
