# modu 프로젝트 관측성 스택. 수집 대상은 modu-infra 네트워크의 컨테이너 이름으로 찾는다.
# 프로젝트 이름(디렉터리 이름) monitoring 을 유지해야 기존 볼륨 monitoring_* 를 그대로 쓴다.
services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    ports:
      - 19090:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - modu-infra
    restart: always

  grafana:
    image: grafana/grafana:13.2.0
    container_name: grafana
    ports:
      - 3000:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus
    networks:
      - modu-infra
    restart: always

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    networks:
      - modu-infra
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - modu-infra
    restart: always

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.20.0
    container_name: mysqld-exporter
    command:
      - --config.my-cnf=/cfg/.my.cnf
    volumes:
      - ./mysql/.my.cnf:/cfg/.my.cnf:ro
    networks:
      - modu-infra
    restart: always

  redis-exporter:
    image: oliver006/redis_exporter:v1.90.0
    container_name: redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    networks:
      - modu-infra
    restart: always

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: mongodb-exporter
    command:
      - --mongodb.uri=${MONGODB_URI}
      - --collect-all
    networks:
      - modu-infra
    restart: always

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    command:
      - --kafka.server=kafka:9092
    networks:
      - modu-infra
    restart: always

  # ---- 로그: 컨테이너 stdout(JSON) → OTel Collector → OpenSearch. 대시보드 http://localhost:5601 ----
  opensearch:
    image: opensearchproject/opensearch:3.3.2
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - cluster.name=modu-logs
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      # dev 전용: 보안 플러그인 끔(내부 네트워크, 포트는 localhost 에만). 운영에선 켜고 Collector·Dashboards 에 계정을 준다.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - 127.0.0.1:9200:9200
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - modu-infra
    restart: always

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.3.0
    container_name: opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - 5601:5601
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - modu-infra
    restart: always

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.141.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    # 도커의 컨테이너 로그 디렉터리는 root 0700 이라 root 로 읽는다(k8s DaemonSet 도 보통 root).
    user: "0:0"
    volumes:
      - ./otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
      # 도커 엔진의 컨테이너 로그 파일(json-file 드라이버). 읽기 전용.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otel-checkpoints:/var/lib/otelcol
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - modu-infra
    restart: always

networks:
  modu-infra:
    external: true

volumes:
  prometheus-data:
  grafana-data:
  opensearch-data:
  otel-checkpoints:
