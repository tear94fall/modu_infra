global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: modu-messenger
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway-service:8000
          - auth-service:9900
          - member-service:8082
          - chat-service:9090
          - profile-service:8880
          - push-service:9990
          - storage-service:9999
          - ws-service:8090
          - chat-store-service:8100
          - config-service:8888
          - point-service:9600
          - schedule-service:8110

  - job_name: mysql
    metrics_path: /probe
    params:
      auth_module: [client]
    static_configs:
      - targets:
          - mysql-member:3306
          - mysql-chat:3306
          - mysql-push:3306
          - mysql-profile:3306
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: mysqld-exporter:9104

  # mysql-commerce 는 root 비밀번호가 messenger 쪽 MySQL 과 달라 .my.cnf 의 별도 섹션을 쓴다.
  - job_name: mysql-commerce
    metrics_path: /probe
    params:
      auth_module: [client.commerce]
    static_configs:
      - targets:
          - mysql-commerce:3306
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: mysqld-exporter:9104

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: mongodb
    static_configs:
      - targets: [mongodb-exporter:9216]

  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
